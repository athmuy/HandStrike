<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HandStrike - Kuis Gestur AI</title>

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- INTRO -->
<div id="screen-intro" class="screen active">
  <div class="wave-logo">
    <span class="w1">H</span><span class="w2">a</span><span class="w3">n</span><span class="w4">d</span><span class="w5">S</span><span class="w6">t</span><span class="w7">r</span><span class="w8">i</span><span class="w9">k</span><span class="w10">e</span>
  </div>

  <p class="intro-sub">
    Jawab kuis dengan gerakan tangan!
  </p>

  <button class="btn-primary" onclick="showScreen('setup')">🚀 Mulai</button>
</div>

<!-- SETUP -->
<div id="screen-setup" class="screen">
  <div class="setup-box">
    <h2>Setup Model</h2>

    <input type="text" id="model-url-input" placeholder="Masukkan URL model">

    <button class="btn-primary" onclick="startGame()">Mulai Kamera</button>
  </div>
</div>

<!-- GAME -->
<div id="screen-game" class="screen">

  <!-- KAMERA -->
  <div class="cam-panel">
    <h3>📷 Kamera</h3>

    <div class="cam-view-wrap">
      <canvas id="webcam-canvas"></canvas>
      <div id="status-text">Klik mulai untuk kamera</div>
    </div>

    <div class="gesture-display">
      <div>Gesture:</div>
      <div id="detected-gesture">-</div>
    </div>

    <div class="hold-bar-track">
      <div id="answer-progress-bar"></div>
    </div>
  </div>

  <!-- QUIZ -->
  <div class="quiz-panel">

    <div class="quiz-topbar">
      <span id="current-question-num">1</span>
      <div class="quiz-progress-track">
        <div class="quiz-progress-fill"></div>
      </div>
      <span id="score-display">0 poin</span>
    </div>

    <div class="quiz-main">
      <div class="question-bubble">
        <div id="question-text">Loading...</div>
      </div>

      <div class="choices-row">
        <div class="choice-card left">
          <div id="option-left">A</div>
        </div>
        <div class="choice-card right">
          <div id="option-right">B</div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- RESULT -->
<div id="screen-result" class="screen">
  <h1>Hasil</h1>
  <div id="result-score"></div>

  <button onclick="location.reload()">Main Lagi</button>
</div>

<!-- SCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose"></script>

<script src="quiz-data.js"></script>
<script src="app.js"></script>

<script>
function showScreen(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + screen).classList.add('active');
}

function startGame() {
  showScreen('game');
  loadModel(); // panggil dari klik (AMAN)
}
</script>

</body>
</html>
